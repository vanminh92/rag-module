[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[runner]
fastReruns = false

[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
baseRadius = "0.875rem"
buttonRadius = "0.625rem"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#0F766E"

[theme.light.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#141E30"
textColor = "#F1F5F9"
borderColor = "#334155"
linkColor = "#5EEAD4"

[theme.dark.sidebar]
backgroundColor = "#111A2A"
secondaryBackgroundColor = "#141E30"
